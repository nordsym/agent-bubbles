<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Swarm Bubbles - NordSym</title>
    
    <!-- NordSym Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@300;400;500;600;700;800&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
           NORDSYM DESIGN TOKENS
           Premium Glass Orb Edition
           ============================================ */
        :root {
            /* === DARK MODE (Deep Space / Obsidian) === */
            --nord-deep-space: #050608;
            --nord-mid-space: #0c1427;
            --nord-surface: rgba(12, 14, 18, 0.85);
            --nord-surface-hover: rgba(12, 14, 18, 0.95);
            
            /* Accent Colors */
            --nord-cyan: #00D4FF;
            --nord-cyan-rgb: 0, 212, 255;
            --nord-light-accent: #7dd3fc;
            --nord-orange: #FF8C00;
            --nord-purple: #9370DB;
            
            /* Status Colors */
            --status-active: #00FF88;
            --status-active-rgb: 0, 255, 136;
            --status-waiting: #FFB800;
            --status-waiting-rgb: 255, 184, 0;
            --status-error: #FF4757;
            --status-error-rgb: 255, 71, 87;
            --status-idle: #6B7280;
            --status-idle-rgb: 107, 114, 128;
            
            /* Text Colors */
            --nord-text-primary: #FFFFFF;
            --nord-text-secondary: #E2E8F0;
            --nord-text-medium: #CBD5E1;
            --nord-text-muted: rgba(255, 255, 255, 0.5);
            
            /* Borders & Lines */
            --nord-border: rgba(255, 255, 255, 0.1);
            --nord-border-hover: rgba(255, 255, 255, 0.2);
            --nord-border-accent: rgba(0, 212, 255, 0.3);
            
            /* === LIGHT MODE (Blåkopia / Blueprint) === */
            --blueprint-bg: #F0F4F8;
            --blueprint-ink: #0F172A;
            --blueprint-text-primary: #1E293B;
            --blueprint-text-secondary: #475569;
            --blueprint-lines: #94A3B8;
            --blueprint-lines-faint: #CBD5E1;
            --blueprint-cyan: #0284C7;
            --blueprint-cyan-rgb: 2, 132, 199;
            
            /* Shadows */
            --shadow-card: 0 20px 40px -10px rgba(0,0,0,0.8);
            --shadow-card-hover: 0 30px 60px -12px rgba(0,0,0,0.9);
            --shadow-glow: 0 0 30px rgba(0, 212, 255, 0.2);
            
            /* Borders */
            --radius-card: 2rem;
            --radius-card-sm: 1.5rem;
            --radius-pill: 9999px;
            
            /* Glassmorphism */
            --glass-blur: blur(20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--nord-deep-space);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            color: var(--nord-text-primary);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }

        /* Light Mode */
        body.light-theme {
            background-color: var(--blueprint-bg);
            color: var(--blueprint-ink);
            background-image: none;
        }

        /* Blueprint Grid (Light Mode Only) */
        .blueprint-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(148, 163, 184, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        body.light-theme .blueprint-grid { opacity: 1; }

        #bubbleContainer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        /* ============================================
           HEADER - NordSym Style
           ============================================ */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(5,6,8,0.95) 0%, rgba(5,6,8,0.7) 70%, transparent 100%);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }

        body.light-theme .header {
            background: linear-gradient(to bottom, rgba(240,244,248,0.95) 0%, rgba(240,244,248,0.7) 70%, transparent 100%);
            border-bottom: 1px solid var(--blueprint-lines);
        }

        .logo {
            font-family: 'Comfortaa', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--nord-cyan);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--nord-text-primary);
            opacity: 0.7;
        }

        body.light-theme .logo {
            color: var(--blueprint-cyan);
        }
        body.light-theme .logo span {
            color: var(--blueprint-ink);
        }

        .stats {
            display: flex;
            gap: 30px;
        }

        .stat {
            text-align: right;
        }

        .stat-value {
            font-family: 'Source Code Pro', monospace;
            font-size: 24px;
            font-weight: 600;
            color: var(--nord-cyan);
        }

        body.light-theme .stat-value {
            color: var(--blueprint-cyan);
        }

        .stat-label {
            font-size: 12px;
            color: var(--nord-text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        body.light-theme .stat-label {
            color: var(--blueprint-text-secondary);
        }

        /* ============================================
           CONTROLS - NordSym Glassmorphism
           ============================================ */
        .controls {
            position: fixed;
            top: 80px;
            left: 30px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .control-group {
            display: flex;
            gap: 5px;
            background: var(--nord-surface);
            padding: 5px;
            border-radius: var(--radius-card-sm);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--nord-border);
        }

        body.light-theme .control-group {
            background: #ffffff;
            border: 2px solid var(--blueprint-lines);
            box-shadow: 4px 4px 0px rgba(148, 163, 184, 0.2);
        }

        .control-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--nord-text-medium);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            color: var(--nord-text-primary);
        }

        .control-btn.active {
            background: rgba(0,212,255,0.2);
            color: var(--nord-cyan);
        }

        body.light-theme .control-btn {
            color: var(--blueprint-text-secondary);
        }
        body.light-theme .control-btn:hover {
            background: rgba(2, 132, 199, 0.1);
            color: var(--blueprint-ink);
        }
        body.light-theme .control-btn.active {
            background: var(--blueprint-cyan);
            color: #ffffff;
        }

        .control-label {
            padding: 8px 12px;
            color: var(--nord-text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 80px;
            right: 30px;
            z-index: 100;
        }

        .theme-toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--nord-surface);
            border: 1px solid var(--nord-border);
            border-radius: var(--radius-pill);
            color: var(--nord-text-secondary);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            transition: all 0.3s ease;
        }

        .theme-toggle-btn:hover {
            border-color: var(--nord-cyan);
            color: var(--nord-cyan);
        }

        body.light-theme .theme-toggle-btn {
            background: #ffffff;
            border: 2px solid var(--blueprint-lines);
            color: var(--blueprint-ink);
            box-shadow: 4px 4px 0px rgba(148, 163, 184, 0.2);
        }

        body.light-theme .theme-toggle-btn:hover {
            border-color: var(--blueprint-cyan);
            color: var(--blueprint-cyan);
        }

        /* ============================================
           LEGEND - NordSym Style
           ============================================ */
        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            z-index: 100;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--nord-text-medium);
        }

        body.light-theme .legend-item {
            color: var(--blueprint-text-secondary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.active { background: var(--status-active); box-shadow: 0 0 10px var(--status-active); }
        .legend-dot.waiting { background: var(--status-waiting); box-shadow: 0 0 10px var(--status-waiting); }
        .legend-dot.error { background: var(--status-error); box-shadow: 0 0 10px var(--status-error); }
        .legend-dot.idle { background: var(--status-idle); box-shadow: 0 0 10px var(--status-idle); }

        /* ============================================
           BUBBLE - Premium 3D Glass Orb
           ============================================ */
        .bubble {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            user-select: none;
            overflow: hidden;
            
            /* Base styling - will be overwritten by status */
            background: radial-gradient(circle at 30% 30%, 
                rgba(255,255,255,0.15) 0%, 
                rgba(255,255,255,0.05) 20%, 
                rgba(0,0,0,0.2) 60%,
                rgba(0,0,0,0.4) 100%);
            
            /* Smooth transitions */
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                        box-shadow 0.4s ease,
                        filter 0.3s ease;
        }

        /* Inner content wrapper - keeps text inside */
        .bubble-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 15%;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        /* Glass highlight - top left shine */
        .bubble::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 15%;
            width: 35%;
            height: 25%;
            background: radial-gradient(ellipse at center,
                rgba(255,255,255,0.6) 0%,
                rgba(255,255,255,0.3) 30%,
                transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            filter: blur(2px);
        }

        /* Inner depth shadow */
        .bubble::after {
            content: '';
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: radial-gradient(circle at 70% 70%,
                rgba(0,0,0,0.3) 0%,
                transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* ============================================
           STATUS-SPECIFIC 3D GLASS STYLES
           ============================================ */
        .bubble.status-active {
            background: radial-gradient(circle at 30% 30%, 
                rgba(0, 255, 136, 0.25) 0%, 
                rgba(0, 255, 136, 0.1) 25%, 
                rgba(0, 80, 50, 0.3) 60%,
                rgba(0, 40, 25, 0.5) 100%);
            box-shadow: 
                0 0 60px rgba(0, 255, 136, 0.25),
                0 0 120px rgba(0, 255, 136, 0.1),
                inset 0 0 40px rgba(0, 255, 136, 0.1),
                inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 136, 0.3);
            animation: pulse-glow-active 3s ease-in-out infinite;
        }

        .bubble.status-waiting {
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 184, 0, 0.25) 0%, 
                rgba(255, 184, 0, 0.1) 25%, 
                rgba(100, 70, 0, 0.3) 60%,
                rgba(50, 35, 0, 0.5) 100%);
            box-shadow: 
                0 0 50px rgba(255, 184, 0, 0.2),
                0 0 100px rgba(255, 184, 0, 0.08),
                inset 0 0 35px rgba(255, 184, 0, 0.1),
                inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 184, 0, 0.3);
        }

        .bubble.status-error {
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 71, 87, 0.3) 0%, 
                rgba(255, 71, 87, 0.15) 25%, 
                rgba(100, 20, 25, 0.35) 60%,
                rgba(50, 10, 12, 0.5) 100%);
            box-shadow: 
                0 0 60px rgba(255, 71, 87, 0.3),
                0 0 120px rgba(255, 71, 87, 0.15),
                inset 0 0 40px rgba(255, 71, 87, 0.15),
                inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 71, 87, 0.4);
            animation: pulse-glow-error 1.5s ease-in-out infinite;
        }

        .bubble.status-idle {
            background: radial-gradient(circle at 30% 30%, 
                rgba(107, 114, 128, 0.2) 0%, 
                rgba(107, 114, 128, 0.08) 25%, 
                rgba(40, 45, 50, 0.3) 60%,
                rgba(20, 22, 25, 0.5) 100%);
            box-shadow: 
                0 0 30px rgba(107, 114, 128, 0.1),
                inset 0 0 25px rgba(107, 114, 128, 0.05),
                inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(107, 114, 128, 0.2);
        }

        /* Light mode glass orbs */
        body.light-theme .bubble.status-active {
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.9) 0%, 
                rgba(0, 255, 136, 0.2) 30%, 
                rgba(0, 200, 100, 0.3) 70%,
                rgba(0, 150, 75, 0.4) 100%);
            box-shadow: 
                0 8px 32px rgba(0, 255, 136, 0.3),
                0 0 60px rgba(0, 255, 136, 0.15),
                inset 0 2px 10px rgba(255, 255, 255, 0.8),
                inset 0 -15px 30px rgba(0, 150, 75, 0.2);
            border: 2px solid rgba(0, 255, 136, 0.5);
        }

        body.light-theme .bubble.status-waiting {
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.9) 0%, 
                rgba(255, 184, 0, 0.2) 30%, 
                rgba(220, 160, 0, 0.3) 70%,
                rgba(180, 130, 0, 0.4) 100%);
            box-shadow: 
                0 8px 32px rgba(255, 184, 0, 0.25),
                0 0 50px rgba(255, 184, 0, 0.1),
                inset 0 2px 10px rgba(255, 255, 255, 0.8),
                inset 0 -15px 30px rgba(180, 130, 0, 0.2);
            border: 2px solid rgba(255, 184, 0, 0.5);
        }

        body.light-theme .bubble.status-error {
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.9) 0%, 
                rgba(255, 71, 87, 0.25) 30%, 
                rgba(220, 50, 65, 0.35) 70%,
                rgba(180, 40, 50, 0.45) 100%);
            box-shadow: 
                0 8px 32px rgba(255, 71, 87, 0.3),
                0 0 60px rgba(255, 71, 87, 0.15),
                inset 0 2px 10px rgba(255, 255, 255, 0.8),
                inset 0 -15px 30px rgba(180, 40, 50, 0.2);
            border: 2px solid rgba(255, 71, 87, 0.5);
        }

        body.light-theme .bubble.status-idle {
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.9) 0%, 
                rgba(148, 163, 184, 0.2) 30%, 
                rgba(120, 135, 160, 0.3) 70%,
                rgba(100, 115, 140, 0.4) 100%);
            box-shadow: 
                0 8px 25px rgba(107, 114, 128, 0.2),
                inset 0 2px 10px rgba(255, 255, 255, 0.8),
                inset 0 -15px 30px rgba(100, 115, 140, 0.15);
            border: 2px solid rgba(148, 163, 184, 0.4);
        }

        /* Hover states */
        .bubble:hover {
            transform: scale(1.08);
            z-index: 50;
            filter: brightness(1.1);
        }

        .bubble:hover .bubble-content {
            opacity: 1;
        }

        .bubble:hover .bubble-hover-info {
            opacity: 1;
            transform: translateY(0);
        }

        body.light-theme .bubble:hover {
            transform: scale(1.08);
            filter: brightness(1.05);
        }

        .bubble.expanded {
            transform: scale(1.2);
            z-index: 100;
        }

        /* Animations */
        @keyframes pulse-glow-active {
            0%, 100% { 
                box-shadow: 
                    0 0 60px rgba(0, 255, 136, 0.25),
                    0 0 120px rgba(0, 255, 136, 0.1),
                    inset 0 0 40px rgba(0, 255, 136, 0.1),
                    inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            }
            50% { 
                box-shadow: 
                    0 0 80px rgba(0, 255, 136, 0.35),
                    0 0 150px rgba(0, 255, 136, 0.15),
                    inset 0 0 50px rgba(0, 255, 136, 0.15),
                    inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            }
        }

        @keyframes pulse-glow-error {
            0%, 100% { 
                box-shadow: 
                    0 0 60px rgba(255, 71, 87, 0.3),
                    0 0 120px rgba(255, 71, 87, 0.15),
                    inset 0 0 40px rgba(255, 71, 87, 0.15),
                    inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            }
            50% { 
                box-shadow: 
                    0 0 80px rgba(255, 71, 87, 0.45),
                    0 0 150px rgba(255, 71, 87, 0.2),
                    inset 0 0 50px rgba(255, 71, 87, 0.2),
                    inset 0 -20px 40px rgba(0, 0, 0, 0.3);
            }
        }

        /* ============================================
           BUBBLE CONTENT - Responsive Text
           ============================================ */
        
        /* Initial/Icon for small bubbles */
        .bubble-initial {
            font-family: 'Comfortaa', sans-serif;
            font-weight: 700;
            color: var(--nord-text-primary);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            line-height: 1;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        body.light-theme .bubble-initial {
            color: var(--blueprint-ink);
            text-shadow: 0 1px 3px rgba(255,255,255,0.5);
        }

        /* Full info - hidden by default on small bubbles */
        .bubble-full-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .bubble-name {
            font-family: 'Comfortaa', sans-serif;
            font-weight: 700;
            color: var(--nord-text-primary);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
            line-height: 1.2;
        }

        body.light-theme .bubble-name {
            color: var(--blueprint-ink);
            text-shadow: none;
        }

        .bubble-model {
            font-family: 'Source Code Pro', monospace;
            color: var(--nord-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            opacity: 0.8;
        }

        body.light-theme .bubble-model {
            color: var(--blueprint-text-secondary);
        }

        .bubble-cost {
            font-family: 'Source Code Pro', monospace;
            font-weight: 700;
            color: var(--nord-cyan);
        }

        body.light-theme .bubble-cost {
            color: var(--blueprint-cyan);
        }

        .bubble-cost-change {
            font-family: 'Source Code Pro', monospace;
        }

        .bubble-cost-change.positive { color: var(--status-active); }
        .bubble-cost-change.negative { color: var(--status-error); }

        .bubble-tokens {
            font-family: 'Source Code Pro', monospace;
            color: var(--nord-text-medium);
            opacity: 0.9;
        }

        body.light-theme .bubble-tokens {
            color: var(--blueprint-text-secondary);
        }

        .bubble-runtime {
            color: var(--nord-text-secondary);
            opacity: 0.9;
        }

        body.light-theme .bubble-runtime {
            color: var(--blueprint-text-secondary);
        }

        .bubble-progress {
            width: 70%;
            height: 3px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }

        body.light-theme .bubble-progress {
            background: rgba(0,0,0,0.1);
        }

        .bubble-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--nord-cyan), var(--status-active));
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        body.light-theme .bubble-progress-bar {
            background: linear-gradient(90deg, var(--blueprint-cyan), var(--status-active));
        }

        .bubble-sparkline {
            margin-top: 4px;
            opacity: 0.8;
        }

        .bubble-error-icon {
            position: absolute;
            top: 12%;
            right: 12%;
            font-size: 14px;
            z-index: 10;
            animation: shake 0.5s ease-in-out infinite;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        /* Status indicator dot */
        .bubble-status-dot {
            position: absolute;
            bottom: 12%;
            right: 12%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            z-index: 10;
        }

        .bubble.status-active .bubble-status-dot {
            background: var(--status-active);
            box-shadow: 0 0 8px var(--status-active);
            animation: dot-pulse 1.5s ease-in-out infinite;
        }

        .bubble.status-waiting .bubble-status-dot {

    <script>
        // Theme Toggle
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            
            body.classList.toggle('light-theme');
            
            if (body.classList.contains('light-theme')) {
                icon.textContent = '☀️';
                text.textContent = 'Blåkopia';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'Deep Space';
            }
        }

        // Mock agent data
        const agents = [
            { id: 1, name: 'Main Orchestrator', model: 'Claude Opus 4', status: 'active', activity: 0.9, cost: 4.87, costRate: 0.12, runtime: 847, tokensIn: 89000, tokensOut: 36000, calls: 23, completion: 67, task: 'Analyzing codebase and generating documentation for the API module', history: [] },
            { id: 2, name: 'Code Analyzer', model: 'Claude Sonnet 4', status: 'active', activity: 0.7, cost: 1.23, costRate: 0.05, runtime: 423, tokensIn: 45000, tokensOut: 22000, calls: 45, completion: 82, task: 'Running automated tests and fixing failing edge cases', history: [] },
            { id: 3, name: 'Planner', model: 'GPT-4o', status: 'waiting', activity: 0.3, cost: 2.15, costRate: 0.08, runtime: 156, tokensIn: 28000, tokensOut: 6000, calls: 12, completion: 45, task: 'Waiting for human approval on deployment plan', history: [] },
            { id: 4, name: 'Event Router', model: 'Claude Haiku', status: 'active', activity: 0.5, cost: 0.18, costRate: 0.01, runtime: 1203, tokensIn: 67000, tokensOut: 22000, calls: 156, completion: 91, task: 'Processing incoming webhook events and routing messages', history: [] },
            { id: 5, name: 'Research Agent', model: 'Claude Opus 4', status: 'error', activity: 0.8, cost: 0.89, costRate: 0.0, runtime: 89, tokensIn: 19000, tokensOut: 4000, calls: 8, completion: 34, task: 'ERROR: Rate limit exceeded on external API', history: [] },
            { id: 6, name: 'Security Scanner', model: 'GPT-4 Turbo', status: 'active', activity: 0.6, cost: 0.67, costRate: 0.03, runtime: 312, tokensIn: 34000, tokensOut: 11000, calls: 19, completion: 55, task: 'Reviewing pull request #847 for security vulnerabilities', history: [] },
            { id: 7, name: 'Data Pipeline', model: 'Claude Haiku', status: 'idle', activity: 0.1, cost: 0.03, costRate: 0.0, runtime: 0, tokensIn: 800, tokensOut: 400, calls: 2, completion: 100, task: 'Idle - waiting for scheduled trigger at 14:00', history: [] },
            { id: 8, name: 'Email Composer', model: 'Claude Sonnet 4', status: 'waiting', activity: 0.4, cost: 0.34, costRate: 0.02, runtime: 67, tokensIn: 8900, tokensOut: 3100, calls: 7, completion: 78, task: 'Composing response draft, awaiting user confirmation', history: [] },
            { id: 9, name: 'Report Generator', model: 'Claude Opus 4', status: 'active', activity: 0.65, cost: 0.98, costRate: 0.04, runtime: 234, tokensIn: 42000, tokensOut: 14000, calls: 31, completion: 62, task: 'Generating weekly report summary from collected metrics', history: [] },
            { id: 10, name: 'Monitor Bot', model: 'GPT-4o Mini', status: 'active', activity: 0.4, cost: 0.08, costRate: 0.005, runtime: 3600, tokensIn: 12000, tokensOut: 3000, calls: 89, completion: 100, task: 'Continuous system health monitoring', history: [] },
        ];

        // Initialize activity history
        agents.forEach(agent => {
            agent.history = Array.from({length: 30}, () => Math.random() * agent.activity);
        });

        const statusColors = {
            active: '#00FF88',
            waiting: '#FFB800',
            error: '#FF4757',
            idle: '#6B7280'
        };

        let currentFilter = 'all';
        let currentSort = 'cost';
        let expandedBubble = null;
        let bubbleElements = [];

        // Size thresholds for content display
        const SIZE_TINY = 100;      // Only initial
        const SIZE_SMALL = 140;     // Initial + cost
        const SIZE_MEDIUM = 180;    // Name + cost + tokens
        const SIZE_LARGE = 220;     // Full info

        // Physics simulation
        class BubblePhysics {
            constructor(element, agent, index, total) {
                this.element = element;
                this.agent = agent;
                this.size = this.calculateSize(agent);
                
                // Random initial position
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const angle = (index / total) * Math.PI * 2;
                const radius = Math.min(window.innerWidth, window.innerHeight) * 0.25;
                
                this.x = centerX + Math.cos(angle) * radius + (Math.random() - 0.5) * 100;
                this.y = centerY + Math.sin(angle) * radius + (Math.random() - 0.5) * 100;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                
                this.updateElement();
            }

            calculateSize(agent) {
                const minSize = 100;
                const maxSize = 240;
                const maxCost = Math.max(...agents.map(a => a.cost));
                const normalized = agent.cost / maxCost;
                return minSize + normalized * (maxSize - minSize);
            }

            update(allBubbles) {
                // Apply gentle random force
                this.vx += (Math.random() - 0.5) * 0.1;
                this.vy += (Math.random() - 0.5) * 0.1;
                
                // Damping
                this.vx *= 0.98;
                this.vy *= 0.98;
                
                // Speed limit
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > 1.5) {
                    this.vx = (this.vx / speed) * 1.5;
                    this.vy = (this.vy / speed) * 1.5;
                }

                // Wall boundaries with padding
                const padding = 100;
                const halfSize = this.size / 2;
                
                if (this.x - halfSize < padding) { this.x = padding + halfSize; this.vx *= -0.5; }
                if (this.x + halfSize > window.innerWidth - padding) { this.x = window.innerWidth - padding - halfSize; this.vx *= -0.5; }
                if (this.y - halfSize < padding + 50) { this.y = padding + 50 + halfSize; this.vy *= -0.5; }
                if (this.y + halfSize > window.innerHeight - 50) { this.y = window.innerHeight - 50 - halfSize; this.vy *= -0.5; }

                // Collision with other bubbles
                for (const other of allBubbles) {
                    if (other === this || !other.element.style.display !== 'none') continue;
                    
                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = (this.size + other.size) / 2 + 15;
                    
                    if (dist < minDist && dist > 0) {
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = (minDist - dist) / 2;
                        
                        this.x -= overlap * nx * 0.5;
                        this.y -= overlap * ny * 0.5;
                        other.x += overlap * nx * 0.5;
                        other.y += overlap * ny * 0.5;
                        
                        // Bounce
                        const dvx = this.vx - other.vx;
                        const dvy = this.vy - other.vy;
                        const dvn = dvx * nx + dvy * ny;
                        
                        if (dvn > 0) {
                            this.vx -= 0.5 * dvn * nx;
                            this.vy -= 0.5 * dvn * ny;
                            other.vx += 0.5 * dvn * nx;
                            other.vy += 0.5 * dvn * ny;
                        }
                    }
                }

                this.x += this.vx;
                this.y += this.vy;
                
                this.updateElement();
            }

            updateElement() {
                this.element.style.width = this.size + 'px';
                this.element.style.height = this.size + 'px';
                this.element.style.left = (this.x - this.size / 2) + 'px';
                this.element.style.top = (this.y - this.size / 2) + 'px';
                
                // Update content visibility based on size
                this.updateContentForSize();
            }

            updateContentForSize() {
                const content = this.element.querySelector('.bubble-content');
                if (!content) return;

                const size = this.size;
                
                // Calculate dynamic font sizes based on bubble size
                const baseFontSize = Math.max(8, Math.min(16, size * 0.07));
                const initialSize = Math.max(16, Math.min(48, size * 0.25));
                const nameSize = Math.max(10, Math.min(16, size * 0.075));
                const costSize = Math.max(12, Math.min(22, size * 0.1));
                const smallSize = Math.max(7, Math.min(11, size * 0.05));
                
                const initial = content.querySelector('.bubble-initial');
                const fullInfo = content.querySelector('.bubble-full-info');
                const name = content.querySelector('.bubble-name');
                const model = content.querySelector('.bubble-model');
                const cost = content.querySelector('.bubble-cost');
                const costChange = content.querySelector('.bubble-cost-change');
                const tokens = content.querySelector('.bubble-tokens');
                const runtime = content.querySelector('.bubble-runtime');
                const progress = content.querySelector('.bubble-progress');
                const sparkline = content.querySelector('.bubble-sparkline');

                if (size < SIZE_TINY) {
                    // Tiny: Only initial
                    if (initial) {
                        initial.style.display = 'block';
                        initial.style.fontSize = initialSize + 'px';
                    }
                    if (fullInfo) fullInfo.style.display = 'none';
                } else if (size < SIZE_SMALL) {
                    // Small: Initial + cost below
                    if (initial) {
                        initial.style.display = 'block';
                        initial.style.fontSize = (initialSize * 0.7) + 'px';
                    }
                    if (fullInfo) fullInfo.style.display = 'flex';
                    if (name) name.style.display = 'none';
                    if (model) model.style.display = 'none';
                    if (cost) { cost.style.display = 'block'; cost.style.fontSize = costSize + 'px'; }
                    if (costChange) costChange.style.display = 'none';
                    if (tokens) tokens.style.display = 'none';
                    if (runtime) runtime.style.display = 'none';
                    if (progress) progress.style.display = 'none';
                    if (sparkline) sparkline.style.display = 'none';
                } else if (size < SIZE_MEDIUM) {
                    // Medium: Name + cost + basic info
                    if (initial) initial.style.display = 'none';
                    if (fullInfo) fullInfo.style.display = 'flex';
                    if (name) { name.style.display = 'block'; name.style.fontSize = nameSize + 'px'; }
                    if (model) { model.style.display = 'block'; model.style.fontSize = smallSize + 'px'; }
                    if (cost) { cost.style.display = 'block'; cost.style.fontSize = costSize + 'px'; }
                    if (costChange) { costChange.style.display = 'block'; costChange.style.fontSize = smallSize + 'px'; }
                    if (tokens) tokens.style.display = 'none';
                    if (runtime) runtime.style.display = 'none';
                    if (progress) progress.style.display = 'block';
                    if (sparkline) sparkline.style.display = 'none';
                } else {
                    // Large: Full info
                    if (initial) initial.style.display = 'none';
                    if (fullInfo) fullInfo.style.display = 'flex';
                    if (name) { name.style.display = 'block'; name.style.fontSize = nameSize + 'px'; }
                    if (model) { model.style.display = 'block'; model.style.fontSize = smallSize + 'px'; }
                    if (cost) { cost.style.display = 'block'; cost.style.fontSize = costSize + 'px'; }
                    if (costChange) { costChange.style.display = 'block'; costChange.style.fontSize = smallSize + 'px'; }
                    if (tokens) { tokens.style.display = 'block'; tokens.style.fontSize = smallSize + 'px'; }
                    if (runtime) { runtime.style.display = 'block'; runtime.style.fontSize = (smallSize + 1) + 'px'; }
                    if (progress) progress.style.display = 'block';
                    if (sparkline) { 
                        sparkline.style.display = 'block';
                        const sparkSize = Math.min(80, size * 0.4);
                        sparkline.style.width = sparkSize + 'px';
                        sparkline.style.height = (sparkSize * 0.25) + 'px';
                    }
                }
            }

            updateSize() {
                this.size = this.calculateSize(this.agent);
                this.updateElement();
            }
        }

        function getInitial(name) {
            const words = name.split(' ');
            if (words.length >= 2) {
                return words[0][0] + words[1][0];
            }
            return name.substring(0, 2).toUpperCase();
        }

        function createBubble(agent) {
            const bubble = document.createElement('div');
            bubble.className = `bubble status-${agent.status}`;
            bubble.dataset.agentId = agent.id;
            
            const costChange = agent.costRate > 0 ? `+$${agent.costRate.toFixed(3)}/m` : '—';
            const costClass = agent.costRate > 0 ? 'positive' : '';
            const initial = getInitial(agent.name);
            
            bubble.innerHTML = `
                ${agent.status === 'error' ? '<div class="bubble-error-icon">⚠️</div>' : ''}
                <div class="bubble-status-dot"></div>
                <div class="bubble-content">
                    <div class="bubble-initial">${initial}</div>
                    <div class="bubble-full-info">
                        <div class="bubble-name">${agent.name}</div>
                        <div class="bubble-model">${agent.model}</div>
                        <div class="bubble-cost">$${agent.cost.toFixed(2)}</div>
                        <div class="bubble-cost-change ${costClass}">${costChange}</div>
                        <div class="bubble-tokens">${formatTokens(agent.tokensIn)}↓ ${formatTokens(agent.tokensOut)}↑</div>
                        <div class="bubble-runtime">${formatTime(agent.runtime)}</div>
                        <div class="bubble-progress">
                            <div class="bubble-progress-bar" style="width: ${agent.completion}%"></div>
                        </div>
                        <canvas class="bubble-sparkline"></canvas>
                    </div>
                </div>
            `;
            
            bubble.addEventListener('click', () => showModal(agent));
            
            document.getElementById('bubbleContainer').appendChild(bubble);
            
            // Draw sparkline
            const sparkline = bubble.querySelector('.bubble-sparkline');
            if (sparkline) {
                drawSparkline(sparkline, agent.history, agent.status);
            }
            
            return bubble;
        }

        function drawSparkline(canvas, data, status) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            const color = statusColors[status];
            
            ctx.clearRect(0, 0, width, height);
            
            const max = Math.max(...data, 0.1);
            const step = width / (data.length - 1);
            
            // Fill
            ctx.beginPath();
            ctx.moveTo(0, height);
            data.forEach((val, i) => {
                ctx.lineTo(i * step, height - (val / max) * height * 0.9);
            });
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = color + '30';
            ctx.fill();
            
            // Line
            ctx.beginPath();
            data.forEach((val, i) => {
                const x = i * step;
                const y = height - (val / max) * height * 0.9;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function formatTokens(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(0) + 'k';
            return num.toString();
        }

        function formatTime(seconds) {
            if (seconds >= 3600) {
                const hrs = Math.floor(seconds / 3600);
                const mins = Math.floor((seconds % 3600) / 60);
                return `${hrs}h ${mins}m`;
            }
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateStats() {
            const visible = getFilteredAgents();
            document.getElementById('totalAgents').textContent = visible.length;
            document.getElementById('totalCost').textContent = '$' + visible.reduce((sum, a) => sum + a.cost, 0).toFixed(2);
            document.getElementById('activeCount').textContent = visible.filter(a => a.status === 'active').length;
            document.getElementById('totalTokens').textContent = formatTokens(visible.reduce((sum, a) => sum + a.tokensIn + a.tokensOut, 0));
        }

        function getFilteredAgents() {
            let filtered = [...agents];
            
            if (currentFilter === 'active') {
                filtered = filtered.filter(a => a.status === 'active');
            } else if (currentFilter === 'errors') {
                filtered = filtered.filter(a => a.status === 'error');
            }
            
            if (currentSort === 'cost') {
                filtered.sort((a, b) => b.cost - a.cost);
            } else if (currentSort === 'runtime') {
                filtered.sort((a, b) => b.runtime - a.runtime);
            } else if (currentSort === 'tokens') {
                filtered.sort((a, b) => (b.tokensIn + b.tokensOut) - (a.tokensIn + a.tokensOut));
            }
            
            return filtered;
        }

        function updateBubbleVisibility() {
            const filtered = getFilteredAgents();
            const filteredIds = filtered.map(a => a.id);
            
            bubbleElements.forEach(b => {
                if (filteredIds.includes(b.agent.id)) {
                    b.element.style.display = 'flex';
                } else {
                    b.element.style.display = 'none';
                }
            });
            
            updateStats();
        }

        function updateBubbleContent(bubbleObj) {
            const agent = bubbleObj.agent;
            const bubble = bubbleObj.element;
            
            const costChange = agent.costRate > 0 ? `+$${agent.costRate.toFixed(3)}/m` : '—';
            const costClass = agent.costRate > 0 ? 'positive' : '';
            
            const cost = bubble.querySelector('.bubble-cost');
            const costChangeEl = bubble.querySelector('.bubble-cost-change');
            const tokens = bubble.querySelector('.bubble-tokens');
            const runtime = bubble.querySelector('.bubble-runtime');
            const progressBar = bubble.querySelector('.bubble-progress-bar');
            const sparkline = bubble.querySelector('.bubble-sparkline');
            
            if (cost) cost.textContent = `$${agent.cost.toFixed(2)}`;
            if (costChangeEl) {
                costChangeEl.textContent = costChange;
                costChangeEl.className = `bubble-cost-change ${costClass}`;
            }
            if (tokens) tokens.textContent = `${formatTokens(agent.tokensIn)}↓ ${formatTokens(agent.tokensOut)}↑`;
            if (runtime) runtime.textContent = formatTime(agent.runtime);
            if (progressBar) progressBar.style.width = agent.completion + '%';
            
            // Update sparkline
            if (sparkline) {
                drawSparkline(sparkline, agent.history, agent.status);
            }
            
            // Update size based on new cost
            bubbleObj.updateSize();
        }

        // Modal functions
        function showModal(agent) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalTitle').textContent = agent.name;
            document.getElementById('modalModel').textContent = agent.model;
            document.getElementById('modalStatus').textContent = agent.status;
            document.getElementById('modalStatus').className = 'modal-status ' + agent.status;
            document.getElementById('modalRuntime').textContent = formatTime(agent.runtime);
            document.getElementById('modalCost').textContent = '$' + agent.cost.toFixed(2);
            document.getElementById('modalCostChange').textContent = agent.costRate > 0 ? `+$${agent.costRate.toFixed(3)}/min` : '—';
            document.getElementById('modalCostChange').className = `modal-stat-change ${agent.costRate > 0 ? 'positive' : ''}`;
            document.getElementById('modalCompletion').textContent = agent.completion + '%';
            document.getElementById('modalTokensIn').textContent = formatTokens(agent.tokensIn);
            document.getElementById('modalTokensOut').textContent = formatTokens(agent.tokensOut);
            document.getElementById('modalCalls').textContent = agent.calls;
            document.getElementById('modalTask').textContent = agent.task;
            
            // Activity graph
            const graphContainer = document.getElementById('modalActivityGraph');
            graphContainer.innerHTML = '';
            agent.history.forEach(val => {
                const bar = document.createElement('div');
                bar.className = 'modal-activity-bar';
                bar.style.height = (val * 100) + '%';
                graphContainer.appendChild(bar);
            });
            
            overlay.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') closeModal();
        });

        // Control buttons
        document.querySelectorAll('.control-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.control-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                updateBubbleVisibility();
            });
        });

        document.querySelectorAll('.control-btn[data-sort]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.control-btn[data-sort]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                updateBubbleVisibility();
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 't' || e.key === 'T') toggleTheme();
        });

        // Initialize
        function init() {
            agents.forEach((agent, index) => {
                const element = createBubble(agent);
                const physics = new BubblePhysics(element, agent, index, agents.length);
                bubbleElements.push(physics);
            });
            
            updateStats();
        }

        // Animation loop
        function animate() {
            bubbleElements.forEach(bubble => {
                if (bubble.element.style.display !== 'none') {
                    bubble.update(bubbleElements.filter(b => b.element.style.display !== 'none'));
                }
            });
            requestAnimationFrame(animate);
        }

        // Simulate activity
        setInterval(() => {
            agents.forEach(agent => {
                if (agent.status === 'active') {
                    agent.cost += agent.costRate / 60;
                    agent.tokensIn += Math.floor(Math.random() * 200);
                    agent.tokensOut += Math.floor(Math.random() * 80);
                    agent.runtime++;
                    
                    if (agent.completion < 100) {
                        agent.completion = Math.min(100, agent.completion + Math.random() * 0.5);
                    }
                }
                
                const newActivity = agent.status === 'active' ? 0.3 + Math.random() * 0.7 : 
                                   agent.status === 'waiting' ? 0.1 + Math.random() * 0.3 : 
                                   agent.status === 'error' ? Math.random() * 0.5 : 
                                   Math.random() * 0.1;
                agent.history.shift();
                agent.history.push(newActivity);
            });
            
            bubbleElements.forEach(b => updateBubbleContent(b));
            updateStats();
        }, 1000);

        // Start
        init();
        animate();
    </script>
</body>
</html>
